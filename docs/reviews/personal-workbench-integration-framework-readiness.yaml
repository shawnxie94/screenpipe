- id: DR-EVID-001
  severity: warning
  priority: P1
  status: resolved
  title: "同一批原料并存两套总结逻辑，且事件证据只留每段首尾两条"
  evidence:
  - "activity_ledger.rs:160,173 按 5 分钟无观测切段；build_ledger 只把每段 first/last 两条写入 activity_evidence。"
  - "活动历史（apps/.../activity_history.rs）另起一套模型叙事，存本地加密 store；brain_migration.rs 又把同一批 entries 镜像进 brain_history_entries，形成第三处副本。"
  - "brain_work_unit_revisions 以 (scope_key, interval_start, interval_end) 定位工作单元（work_units.rs:79-83），间隔规则即工作单元身份。"
  impact: "办公高频切换下中间过程全丢；工作单元粒度受间隔切分左右；同一事实多处副本（D-02/§4 规则 2 禁止）。"
  resolution: "D-13：两套总结合并为唯一活动层（间隔 → 摘要 + 关键字 + 原始引用）；证据按变化采样、丢弃记录原因；会话计数按活动去重；旧叙事标 legacy；读源收敛到数据库。O-07/O-09/O-11 记录取值与验证方式。"
  next_action: "并入 P1 收尾遗留项；实现前先定 O-07（阈值与上限）。"

- id: DR-EVID-002
  severity: warning
  priority: P1
  status: resolved
  title: "摘要作为下游唯一入口却过短，且取数方式禁止执行体自查"
  evidence:
  - "activity_history.rs:661-703 的活动生成提示词把带有限证据一次性内联，并明确要求“不要调用工具、使用终端、运行 Shell 命令或再次查询 API”。"
  - "同文件 SYSTEM_PROMPT:53-56 却写“只读使用本地 Screenpipe API”，两条指令自相矛盾。"
  - "现有 Agent 工具只有 brain_answer 与 brain_source（assets/extensions/brain-tools.ts），没有按时间窗查观测的工具。"
  impact: "以一次性快照为准的生成方式既不可复现也不可扩展；摘要过短会让后续 WorkUnit 与知识提炼建立在不充分的理解上。"
  resolution: "D-14：任务只给时间范围/目标/输出契约与铁律，取数由执行体通过只读工具自查，取数方法沉淀为内部 skill，并记录查询轨迹与结果指纹；D-13 规定摘要自足口径（分档长度 + 必含要素 + 关键字）。O-11 记录可复现验证方式。"
  next_action: "并入 P1 收尾遗留项；先补“按时间窗查观测”的只读工具，再改活动生成提示词。"

