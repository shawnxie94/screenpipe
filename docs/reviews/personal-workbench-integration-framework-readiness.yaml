findings:
- id: DR-MOD-001
  severity: blocker
  priority: P1
  status: resolved
  title: "领域包如何扩展 Core 没有定义，而现状扩展点全部是闭集枚举与 SQL CHECK"
  evidence:
  - "迭代 1：crates/screenpipe-core/src/tasks/mod.rs:18 TaskKind 为 7 项闭集；:94 TaskResourceClass 为 5 项闭集。"
  - "迭代 1：crates/screenpipe-engine/src/tasks/mod.rs:311-317 存在 TaskKind→BrainJobKind 手写映射，Core 门面直接认识 Brain 领域。"
  - "迭代 1：crates/screenpipe-db/src/db/brain/types.rs:26 SourceKind 为含 4 个 office 变体的闭集 + is_office() 领域特判。"
  - "迭代 1：create_brain.sql:38-42 / :121-124 / :199-202 的 kind、knowledge_type、kind CHECK；create_tasks.sql:145-155 task_owner_state 以 kind 为主键。"
  - "迭代 2：apps/screenpipe-app-tauri/lib/tasks/types.ts:5-13 为手抄的 TaskKind 联合类型，确认新增种类需同步前后端契约。"
  resolution: "框架新增 D-07：内置包扩展 Core 只能走『包注册清单 + 迁移脚本 + task_owner_state 初始化』；Core 保持闭集、不建动态注册表、不做未知种类兜底；明确接受『新增内置包必然改 Core 枚举』并禁止包内自建调度。§4 规则 3、§5、§7 同步约束。"
  next_action: "P2 计划中把注册清单落成每包一份的实现单元，并补不变量测试（每个已注册 definition 必须有 handler 与 owner_state 行）。"

