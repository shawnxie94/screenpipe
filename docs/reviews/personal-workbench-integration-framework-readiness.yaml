  next_action: "P2 计划中把 scope 迁移（dataset_id 归一 + memories 补列 + 放行入口）写成独立单元，并带一条办公导入样本的隔离验收。"

- id: DR-DATA-002
  severity: warning
  priority: P1
  status: resolved
  title: "D-11 的连接级 scope 赋值无法隔离同一账号内的客户内容"
  evidence:
  - "create_brain.sql 的 brain_office_objects 只有 provider / account_namespace / object_kind / object_id，无空间、项目或客户归属字段（同文件的 brain_office_scopes/cursors 同样只有账号级）。"
  - "D-11（v1.2）原表述为“办公导入的 scope 由连接配置决定，且这是唯一赋值点”。"
  impact: "一个飞书或腾讯会议账号同时包含个人与客户内容时，连接级 scope 只能全 personal（隔离失效）或全 work（个人检索受损）；两类新输出口（克隆发布、文件导出）也失去可靠过滤依据。"
  resolution: "D-11 补对象级改判要求（按群/空间/文档归属映射 + 手工标记入口，连接级仅作默认值）；§6 新增 O-06（最晚 scope 迁移批内、含判定用例），§5 新增对应冻结点。"
  next_action: "P2 scope 迁移批内同时落地导入规则映射与手工改判，并验证同连接内个人文档仍可检索。"

