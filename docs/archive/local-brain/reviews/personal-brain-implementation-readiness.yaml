findings:
- id: DR-LIFECYCLE-001
  severity: blocker
  priority: P1
  status: open
  title: 显式删除、崩溃恢复和 retention 尚未形成完整清理链
  proof: synthetic_reproduced_and_source_review
  acceptance_ids:
  - AC-R1-03
  - AC-R3-02
  - AC-R6-01
  - AC-R6-02
  - AC-R6-03
  - AC-R9-03
  original_units:
  - U02
  - U05
  - U06
  - U07
  - U09
  - U10
  evidence:
  - crates/screenpipe-engine/src/brain/deletion.rs:230：传播主要修改有效性；273 行直接标 completed；370 行 recover_incomplete 不读取 journal 文件、不重放清理，只完成
    DB 中未完波次。
  - crates/screenpipe-db/src/db/brain/deletion.rs:254：Work Unit 只改 state；知识只修改 published availability，未擦除修订正文。
  - crates/screenpipe-db/src/db/brain/sources.rs:419 与 77：通用删除写 source_locator 墓碑，办公注册只检查 office_object 墓碑，命名空间不一致。
  - crates/screenpipe-engine/src/routes/data.rs:46：/data/delete-range 直接删除底层数据/文件，无 Brain 删除调用；对应 db/maintenance.rs 无 Brain
    传播。
  - crates/screenpipe-engine/src/retention.rs:489,524：原始文本先删除再传播；不能满足已发布知识引用原始文本豁免。
  - contract-probes P01/P02/P09：删除成功后仍有 2 处派生正文/索引；只有 journal 的删除未恢复；办公对象删除后可以再次注册。
  impact: 用户删除的内容仍可能留在历史正文、索引或重导入副本中；清理完成状态不能作为已遗忘的证据。自动保留期也可能先破坏应豁免的原文。
  next_action: F02 统一所有删除入口、原始/派生/文件/索引清理及无正文墓碑；journal 与 DB 序号核对恢复；失败保持待重试；retention 在删除原文前计算豁免。
- id: DR-HISTORY-001
  severity: blocker
  priority: P1
  status: open
  title: 迁移没有切换唯一读写来源，校验和加密边界不完整
  proof: source_review
  acceptance_ids:
  - AC-R1-04
  - AC-R6-02
  - AC-R8-03
  original_units:
  - U07
  evidence:
  - apps/screenpipe-app-tauri/src-tauri/src/activity_history.rs:374,387：read_all/write_all 仍访问旧 store；brain_history_active/migration_in_progress
    没有读写入口消费。1572/2572 是异步 best-effort 镜像。
  - apps/screenpipe-app-tauri/src-tauri/src/brain_migration.rs:40,65,111：先读快照后置迁移标记；导入 encoding 固定 plain，不能以旧 store 的文件解密作为允许降级到明文
    DB 的依据。
  - crates/screenpipe-engine/src/brain/migration.rs:204：brain_history_counts 返回 (entries, spans)，却取 entries 当 coverage_spans；只比数量下限，没有完整区间对照。
  impact: “迁移 active”不能证明历史已安全接管；离线镜像失败、新旧副本差异或覆盖区间遗漏可能造成记录缺失，回退也可能恢复已删除内容。
  next_action: F03 修复快照冻结、幂等导入、逐项摘要及完整 coverage 对照、事务切换和失败恢复；加密历史保持同等级保护，密钥不可用暂停。
