  impact: 可能漏抽、重抽、跨越启用边界，取消后仍留下产物；回填资料难以聚成 SOP，驳回后持续产生重复待审。JSON 合法不能代表流程归纳正确。
  next_action: F04 用来源/区间/分类/模型身份的稳定修订和持久游标；实现受租约、删除及来源修订共同约束的原子提交；修复事件映射、持久引用和类型专属编译门槛。
- id: DR-KNOWLEDGE-001
  severity: blocker
  priority: P1
  status: open
  title: 版本行 ID 与版本号混用，失败发布也会修改旧版
  proof: synthetic_reproduced_and_source_review
