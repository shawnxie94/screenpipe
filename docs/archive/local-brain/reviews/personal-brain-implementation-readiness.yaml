    commit 已修改旧版的事务。
  - contract-probes P07：第二条知识发布 v2 后 v1 仍为 published；P08：错误 revision 的发布返回 false，却将原 v1 改为 superseded。
  - crates/screenpipe-engine/src/brain/routes.rs:456：编辑 CAS 与正文更新是分开的写入；531 行发布先查来源再提交，来源有效性检查不含准确修订、暂停/归档可核验性，且无同事务保护。
  impact: 多条知识和并发审核时，当前版本与历史状态可能自相矛盾；一次冲突操作即可让已发布知识停止可用，删除竞态也可能允许过时内容发布。
  next_action: F05 明确 row_id/version 两类身份并迁移现有指针；编辑/发布使用同事务 CAS，失败完全回滚；发布依赖来源与删除 epoch 同时重验。
