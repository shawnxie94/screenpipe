  evidence:
  - apps/screenpipe-app-tauri/src-tauri/src/brain_runtime.rs:136：复用 preset.api_key 值（加密 store），没有采用要求中的 Keychain secret_ref；未读取用户实际密钥，本结论仅来自源码。
  - apps/screenpipe-app-tauri/src-tauri/src/brain_runtime.rs:167,178,197,258：启动失败的 ? 可绕过清理；外层 timeout 丢弃 future 后正常清理段不执行，取消
    watcher 和残留目录无完整回收契约。
  - crates/screenpipe-engine/src/brain/worker.rs:268：BudgetedExecutor 每次租约重建；brain_job_model_call 没有生产调用，最多三次模型调用不跨重试累计；暂停配置错误
    helper 未接入实际失败路径。
  - crates/screenpipe-engine/src/brain/answer.rs:40：交互单独 semaphore，后台 worker 同时执行，无法证明共享资源预算、公平调度和请求断开后的取消。
  impact: 重试可能超出任务预算，取消/超时可留下进程或受管会话资料；Keychain 规则尚未落到该调用链。这里不把用户允许的 ACP 或切换 Runtime 本身视为缺陷。
  next_action: F09 保留选中 preset/手动 Runtime 切换，明确不同 Runtime 的受限能力；实现持久调用预算、共享调度、drop-safe 进程与目录回收、Keychain 引用及执行身份记录。
