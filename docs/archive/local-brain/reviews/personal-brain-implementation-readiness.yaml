  - apps/screenpipe-app-tauri/src-tauri/src/brain_runtime.rs:436：每 5 分钟回看固定 26 小时；已完成任务不作为持久 checkpoint，首次启用前数据和长时间停机后的积压边界均不可靠。
  - crates/screenpipe-engine/src/brain/migration.rs:291：回填 scope 使用每段起止时间；compile.rs:35 要同 scope 至少 3 个 Work Unit，单次规则/异常也被统一拦截。
  - crates/screenpipe-engine/src/brain/extract.rs:140,155,217：模型返回后先写正文，再单独写依赖且忽略失败；提交无租约/删除/修订原子重验。ui_event 映射 ui_monitoring，与
    activity_evidence 的 ui_events 事件身份不一致；eN 映射未随正文持久化。
  - crates/screenpipe-engine/src/brain/compile.rs:134,158：输入使用 Work Unit ID + 空修订；每次新增 candidate，未消费驳回抑制；registry/mod.rs:62
